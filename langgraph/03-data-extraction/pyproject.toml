[project]
name = "langgraph-03-data-extraction"
version = "0.1.0"
description = "UC3 data-extraction as a tiny langgraph StateGraph: extract -> validate -> retry-once, with Pydantic validation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.32,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.3,<2",
    "langchain-core>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27,<0.29",
    # FakeListChatModel touches langchain.globals.verbose at invoke time, which
    # requires the top-level `langchain` package to be importable. We only need
    # langchain-core at runtime, so this is a test-only dependency.
    "langchain>=1.3,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "integration: hits the live local Qwen model via the gateway (gated by RUN_INTEGRATION=1)",
    "anthropic: requires Anthropic models (gated by RUN_ANTHROPIC_TESTS=1)",
]

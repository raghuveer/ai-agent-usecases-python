[project]
name = "langgraph-07-multi-agent"
version = "0.1.0"
description = "UC7 multi-agent, langgraph approach (showcase): orchestrator routing researcher → writer → reviewer → (revise loop | END) over one shared typed state."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.32,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "langgraph>=0.2.50,<0.3",
    "langchain-openai>=0.2.10,<0.3",
    "langchain-core>=0.3.20,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "integration: hits the live model via the gateway (gated by RUN_INTEGRATION=1)",
    "anthropic: requires Anthropic models (gated by RUN_ANTHROPIC_TESTS=1)",
]

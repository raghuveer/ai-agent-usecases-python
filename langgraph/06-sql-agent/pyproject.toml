[project]
name = "langgraph-06-sql-agent"
version = "0.1.0"
description = "UC6 sql-agent over a bundled SQLite DB, built as a tiny langgraph StateGraph (generate -> validate -> execute)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.32,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "langgraph>=0.2.50,<0.3",
    "langchain-openai>=0.2.10,<0.3",
    "langchain-core>=0.3.20,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "integration: hits the live local Qwen model via the gateway (gated by RUN_INTEGRATION=1)",
    "anthropic: requires Anthropic models (gated by RUN_ANTHROPIC_TESTS=1)",
]

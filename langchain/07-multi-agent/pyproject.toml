[project]
name = "langchain-07-multi-agent"
version = "0.1.0"
description = "UC7 multi-agent, langchain approach: sequential composition of researcher (offline corpus search) + writer/reviewer LCEL role chains with a plain-Python revise loop."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain>=1.3,<2",
    "langchain-core>=1.4,<2",
    "langchain-openai>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "integration: hits the live model via the gateway (gated by RUN_INTEGRATION=1)",
    "anthropic: requires Anthropic models (gated by RUN_ANTHROPIC_TESTS=1)",
]

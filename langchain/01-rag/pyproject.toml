[project]
name = "langchain-01-rag"
version = "0.1.0"
description = "UC1 RAG over a bundled corpus, built with langchain (LCEL retrieval chain + Chroma)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.1.4",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "integration: hits the live local LLM gateway (gated by RUN_INTEGRATION=1)",
    "anthropic: requires Anthropic models (gated by RUN_ANTHROPIC_TESTS=1)",
]

[project]
name = "raw-api-02-code-generation"
version = "0.1.0"
description = "UC2 code-generation, raw-api approach: openai SDK + hand-written prompt/extract/optional-safe-check."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40,<2",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "integration: hits the live local model via the gateway (gated by RUN_INTEGRATION=1)",
    "anthropic: requires Anthropic models (gated by RUN_ANTHROPIC_TESTS=1)",
]

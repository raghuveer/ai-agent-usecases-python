name: unit-tests

# Runs the offline, fully-mocked unit tests for every example project.
# Integration tests (marked `integration`, which call the live gateway) are
# deliberately NOT run in CI — they need the local AI Utility Platform + a
# virtual key. Unit tests mock the LLM and require no network beyond PyPI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        # Every directory containing tests/test_unit.py becomes a matrix entry.
        run: |
          projects=$(find raw-api langchain langgraph claude-agent-sdk -type f -path '*/tests/test_unit.py' \
            -printf '%h\n' | sed 's#/tests$##' | sort | jq -R . | jq -cs .)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Discovered projects:"; echo "$projects" | jq .

  unit:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    name: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Every project installs with `uv pip install -e .` and ships no
          # lockfile (see .gitignore), so setup-uv's default glob
          # (**/uv.lock, **/requirements*.txt) matches nothing: it warns, and
          # the cache key never changes, so the cache is never invalidated.
          # Key it on the one file that does determine this project's
          # dependency set — its own pyproject.toml.
          cache-dependency-glob: ${{ matrix.project }}/pyproject.toml
      - name: Set up Python
        run: uv python install 3.12
      - name: Create venv + install (dev extras)
        working-directory: ${{ matrix.project }}
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Unit tests (offline, integration deselected)
        working-directory: ${{ matrix.project }}
        run: uv run pytest -q -m "not integration" tests/test_unit.py
      - name: Dependency CVE audit (pip-audit)
        working-directory: ${{ matrix.project }}
        # Audits the project's installed dependency tree against OSV/PyPI advisories
        # and fails the build on any known vulnerability. The chromadb advisory is
        # ignored as an accepted residual: it is a server-side CVE with no published
        # fix, and these examples use chromadb in embedded mode (see docs/security-review.md).
        run: >
          uv run --with pip-audit pip-audit
          --ignore-vuln GHSA-f4j7-r4q5-qw2c
          --ignore-vuln CVE-2026-45829

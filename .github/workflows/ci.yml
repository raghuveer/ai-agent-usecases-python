name: unit-tests

# Runs the offline, fully-mocked unit tests for every example project.
# Integration tests (marked `integration`, which call the live gateway) are
# deliberately NOT run in CI — they need the local AI Utility Platform + a
# virtual key. Unit tests mock the LLM and require no network beyond PyPI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        # Every directory containing tests/test_unit.py becomes a matrix entry.
        run: |
          projects=$(find raw-api langchain langgraph claude-agent-sdk -type f -path '*/tests/test_unit.py' \
            -printf '%h\n' | sed 's#/tests$##' | sort | jq -R . | jq -cs .)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Discovered projects:"; echo "$projects" | jq .

  docs:
    # The comparison pages are generated from the source they describe, so a
    # refactor that renames a traced symbol must not leave them quietly stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Comparison pages are up to date
        run: python scripts/compare_usecase.py --all --check

  unit:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    name: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Key the cache on THIS project's lockfile, not the repo-wide default
          # glob — otherwise a dependency change in any one project would
          # invalidate the cache for all 44.
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install from the lockfile (dev extras)
        working-directory: ${{ matrix.project }}
        # `--locked` fails the build if uv.lock has drifted from pyproject.toml,
        # which is the guarantee that makes committing lockfiles worth anything:
        # a dependency edit without a re-lock cannot merge silently.
        run: uv sync --extra dev --locked
      - name: Unit tests (offline, integration deselected)
        working-directory: ${{ matrix.project }}
        run: uv run pytest -q -m "not integration" tests/test_unit.py
      - name: Dependency CVE audit (pip-audit)
        working-directory: ${{ matrix.project }}
        # Audits the project's installed dependency tree against OSV/PyPI advisories
        # and fails the build on any known vulnerability. The chromadb advisory is
        # ignored as an accepted residual: it is a server-side CVE with no published
        # fix, and these examples use chromadb in embedded mode (see docs/security-review.md).
        #
        # Retried because this step reaches pypi.org on all 44 jobs with a 15s read
        # timeout, so one slow response reddens the whole build. It did: a
        # docs-only commit failed on `ReadTimeout` and passed unchanged on re-run.
        # A red badge that means "pypi was slow" teaches people to ignore red
        # badges, which is worse than the flake.
        #
        # The retry cannot hide a real finding: a genuine vulnerability fails all
        # three attempts and still fails the build. It only costs a vulnerable
        # build ~30s longer to say so.
        run: |
          for attempt in 1 2 3; do
            if uv run --with pip-audit pip-audit \
                 --ignore-vuln GHSA-f4j7-r4q5-qw2c \
                 --ignore-vuln CVE-2026-45829; then
              exit 0
            fi
            echo "pip-audit attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "pip-audit failed three times - treating as a real failure."
          exit 1
